<style>
:root{--bg:#0b0c0e;--bg2:#131418;--card:#1a1b20;--card2:#23252b;--line:#24262c;--line2:#34373f;--fg:#ececee;--fg2:#c9ccd3;--mut:#9da1aa;--dim:#6c707a;--gold:#e2b55c;--gold2:#f3d08a;--gbg:rgba(226,181,92,.13);--ok:#089981;--bad:#f23645;--shadow:0 16px 44px rgba(0,0,0,.55);--chartbg:#0b0c0e}
*{box-sizing:border-box}
/* sin selección de texto: se siente como una app, no como una página */
.app,.app *,.pop,.pop *,.wmenu,.wmenu *,.wmodal,.wmodal *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app input,.app textarea,.pop input,.wmenu input,.wmodal input,.wtxt input{-webkit-user-select:text;user-select:text}
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
img,svg{-webkit-user-drag:none;user-drag:none}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13.5px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--gold2)}button,select,input{font:inherit;color:inherit}
.app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--bg2);min-width:0}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);flex:none}.brand img{width:28px;height:28px;border-radius:50%}
.brand b{font-size:15px;letter-spacing:.02em;white-space:nowrap}.brand span{color:var(--gold)}
.lay{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.lay button{background:none;border:0;border-radius:8px;padding:4px 8px;cursor:pointer;color:var(--fg2);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.lay button:hover{color:var(--fg)}.lay button.on{background:var(--gold);color:#16120a}.lay svg{display:block}
.lay .mtfb{margin-left:4px;border-left:1px solid var(--line);border-radius:0 8px 8px 0;padding-left:10px}.lay .mtfb.on{border-radius:8px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--gold)}.btn.sm{padding:5px 10px;font-size:12.5px}
.st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap}.st i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.st.live i{background:var(--ok);box-shadow:0 0 0 3px rgba(53,196,162,.2)}.st.err i{background:var(--bad)}
.grow{flex:1}.who{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.main{display:grid;grid-template-columns:minmax(0,1fr) var(--wlw,300px);min-height:0}
.app.wl-left .main{grid-template-columns:var(--wlw,300px) minmax(0,1fr)}.app.wl-left .wl{order:-1;border-left:0;border-right:1px solid var(--line)}
.center{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.grid{position:relative;display:grid;gap:2px;background:var(--line);min-height:0;min-width:0}
.grid.l1{grid-template:1fr/1fr}.grid.l2{grid-template:1fr/minmax(0,var(--cf,1fr)) minmax(0,var(--cf2,1fr))}.grid.l2v{grid-template:minmax(0,var(--rf,1fr)) minmax(0,var(--rf2,1fr))/1fr}.grid.l3{grid-template:minmax(0,var(--rf,1fr)) minmax(0,var(--rf2,1fr))/minmax(0,var(--cf,1fr)) minmax(0,var(--cf2,1fr))}.grid.l3>.pane:first-child{grid-row:1/3}
.grid.l4{grid-template:minmax(0,var(--rf,1fr)) minmax(0,var(--rf2,1fr))/minmax(0,var(--cf,1fr)) minmax(0,var(--cf2,1fr))}.grid.l6{grid-template:1fr 1fr/1fr 1fr 1fr}
.grid.mtf{grid-template:minmax(0,1fr) var(--mtfh,168px)/1fr;gap:0;background:var(--bg)}
.pane{position:relative;background:var(--bg);min-width:0;min-height:0;outline:2px solid transparent;outline-offset:-2px}
.pane.act{outline-color:var(--gold)}
.pane>.kc{position:absolute!important;top:0!important;left:0!important;right:0!important;bottom:0!important;width:auto!important;height:auto!important}
/* multitemporalidad */
.grid.mtf>.pane:first-child{margin:8px 8px 0;border:1.5px solid var(--gold);border-radius:14px;overflow:hidden;outline:0}
.mtfrow{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;padding:8px;min-height:0}
.mini{position:relative;display:grid;grid-template-rows:auto 1fr;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px;text-align:left;min-width:0;min-height:0;transition:border-color .15s,background .15s}
.mini:hover{border-color:var(--line2);background:var(--card)}
.mini.on{border-color:var(--gold);background:var(--card);box-shadow:0 0 0 1px var(--gold) inset}
.mh{display:flex;min-width:0;border:0;background:none;color:inherit;font:inherit;padding:0 0 4px;cursor:pointer;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:6px;pointer-events:none}
.mh b{font-size:14px}.mh em{font-style:normal;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini.on .mh b{color:var(--gold2)}.mh em:empty{display:none}.mini.on .mh em{background:var(--gold);color:#16120a;font-weight:700;border-radius:999px;padding:1px 8px}
.mc{display:block;position:relative;min-height:0;cursor:crosshair;touch-action:none}.mz{font-style:normal;color:var(--dim);font-size:12px}.mh:hover .mz{color:var(--gold)}
/* pestañas de mercados favoritos (estilo MT5) */
.ftw{display:flex;align-items:stretch;height:38px;background:var(--bg);border-bottom:1px solid var(--line);min-width:0}
.fta{display:none;flex:none;width:26px;border:0;background:var(--bg2);color:var(--mut);font-size:18px;cursor:pointer}.fta:hover:not(:disabled){color:var(--gold2)}.fta:disabled{opacity:.3;cursor:default}
.ftw.over .fta{display:block}
.fta{position:relative}.fta em{position:absolute;top:3px;right:1px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--gold);color:#16120a;font:800 9.5px/14px Inter,system-ui,sans-serif;font-style:normal;text-align:center}
/* celular: pestañas de mercados de 2 en 2 (nombre arriba, precio y % abajo), encajan al deslizar y las flechas dicen cuántos hay escondidos */
@media (max-width:900px){
  .ftw{height:48px}.fta{width:30px}.ftw.over .fta{display:block}
  .ftabs{scroll-snap-type:x mandatory;overscroll-behavior-x:contain}
  .ftabs .ft[data-s]{flex:0 0 50%;min-width:0;display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;grid-template-rows:auto auto;column-gap:6px;row-gap:1px;align-content:center;padding:3px 6px 3px 10px;scroll-snap-align:start;box-sizing:border-box}
  .ftabs .ft[data-s] .dot{grid-column:1;grid-row:1}
  .ftabs .ft[data-s] b{grid-column:2/4;grid-row:1;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .ftabs .ft[data-s] .x{grid-column:4;grid-row:1/3;align-self:center;opacity:.6;font-size:17px;padding:4px}
  .ftabs .ft[data-s] .p{grid-column:2;grid-row:2;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
  .ftabs .ft[data-s] .c{grid-column:3;grid-row:2;font-size:10.5px}
  .ftabs .ft.add{flex:0 0 auto;scroll-snap-align:end}
}
.fteye{display:none;flex:none;width:40px;border:0;border-left:1px solid var(--line);background:var(--bg2);color:var(--mut);cursor:pointer;place-items:center}.fteye:hover{color:var(--gold2)}.app.h-top .fteye{display:grid}.ftw .fta[data-d="-1"]{border-right:1px solid var(--line)}.ftw .fta[data-d="1"]{border-left:1px solid var(--line)}
.ftabs{flex:1;display:flex;align-items:stretch;gap:0;min-width:0;overflow-x:auto;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ft{position:relative;display:flex;align-items:center;gap:8px;flex:none;padding:0 10px 0 12px;border:0;border-right:1px solid var(--line);background:none;color:var(--mut);cursor:pointer;font-size:12.5px;white-space:nowrap}
.ft:hover{background:var(--card);color:var(--fg)}
.ft.on{background:var(--bg2);color:var(--fg)}.ft.on::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--gold)}
.ft b{font-weight:600}.ft .p{font:600 12px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}.ft .c{font:11px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ft .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}.ft .dot.up{background:var(--ok)}.ft .dot.dn{background:var(--bad)}
.ft .x{border:0;background:none;color:var(--dim);cursor:pointer;font-size:15px;line-height:1;padding:2px 3px;border-radius:5px;opacity:0}
.ft:hover .x,.ft.on .x{opacity:1}.ft .x:hover{color:var(--fg);background:var(--line)}
.ft.add{color:var(--gold);gap:6px;padding:0 12px}.ft.add span:empty{display:none}
/* lista de mercados */
.wl{position:relative;border-left:1px solid var(--line);background:var(--bg2);display:grid;grid-template-rows:auto auto auto 1fr auto;min-height:0;overflow:hidden}
.wlh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 6px 12px}
.wlh h3{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.wlh .x,.x{border:0;background:none;color:var(--dim);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}.wlh .x:hover{color:var(--fg);background:var(--card)}
.wl input{margin:0 10px 8px;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 9px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 8px}
.tabs button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--mut)}
.tabs button.on{border-color:var(--gold);color:var(--gold2)}
.list{overflow:auto;padding:0 6px 8px}
.sy{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.sy:hover{background:var(--card)}.sy.on{border-color:var(--gold);background:var(--gbg)}
.sy b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sy .p{font:600 13px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.sy small{font-size:11px;color:var(--dim)}.sy .c{font:11px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.fv{color:var(--dim);margin-right:2px;cursor:pointer}.fv.on{color:var(--gold)}.fv:hover{color:var(--gold2)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.foot{font-size:10.5px;color:var(--dim);padding:8px 12px;border-top:1px solid var(--line)}
/* ventanitas (Vista y temporalidades) */
.pop{position:fixed;z-index:50;min-width:230px;max-width:min(320px,calc(100vw - 16px));max-height:min(70vh,520px);overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.ph{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding:8px 8px 4px}
.tfr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px 6px 10px;border-radius:8px;cursor:pointer}
.tfr:hover{background:var(--card2)}.tfr.on{background:var(--gbg);color:var(--gold2);font-weight:600}
.st2{border:0;background:none;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px}.st2.on{color:var(--gold)}.st2:hover{background:var(--line)}
.pnote{font-size:11px;color:var(--dim);padding:8px 10px 4px;border-top:1px solid var(--line);margin-top:6px}
.sw{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}.sw:hover{background:var(--card2)}
.sw input{display:none}.sw i{flex:none;width:32px;height:18px;border-radius:999px;background:var(--line2);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--gold)}.sw input:checked+i::after{transform:translateX(14px)}
.pbtns{padding:8px 10px 6px;border-top:1px solid var(--line);margin-top:4px}
.fab{position:fixed;z-index:40;display:none;align-items:center;gap:7px;height:34px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--gold);background:var(--card);color:var(--gold2);font-weight:600;font-size:12.5px;cursor:pointer;touch-action:none;box-shadow:var(--shadow);animation:fabIn .5s ease-out}
.fab:hover{background:var(--gold);color:#16120a}.app.h-top.h-ft .fab{display:inline-flex!important}
@keyframes fabIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
html.light .fab{color:var(--gold)}html.light .fab:hover{color:#fff}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;background:var(--card);color:var(--fg);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;font-size:13px;box-shadow:var(--shadow);transition:opacity .4s}.toast b{color:var(--gold2)}.toast.out{opacity:0}
.fab:hover{color:var(--gold2);border-color:var(--gold)}
.seg{display:flex;gap:4px;padding:2px 8px 6px}.seg button{flex:1;border:1px solid var(--line2);background:var(--bg2);border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12.5px;color:var(--mut)}
.seg button.on{border-color:var(--gold);color:var(--gold2);background:var(--gbg);font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:6px;padding:2px 10px 8px}.swc{position:relative;width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);cursor:pointer;padding:0;display:grid;place-items:center;font-size:12px;color:var(--mut);background:var(--bg2)}
.swc.on{box-shadow:0 0 0 2px var(--gold)}.swc.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cols{display:flex;gap:12px;padding:2px 10px 6px;font-size:12.5px;color:var(--mut)}.cols label{display:flex;align-items:center;gap:6px}.cols input{width:30px;height:24px;border:0;background:none;padding:0;cursor:pointer}
/* tema claro */
html.light{--bg:#ffffff;--bg2:#f7f7f8;--card:#ffffff;--card2:#f0f1f3;--line:#e5e6e9;--line2:#d4d6db;--fg:#15171c;--fg2:#363a43;--mut:#5c616b;--dim:#8b909a;--gold:#a87818;--gold2:#8a6110;--gbg:rgba(168,120,24,.1);--ok:#089981;--bad:#f23645;--shadow:0 12px 34px rgba(16,18,24,.14);color-scheme:light}
html.light body,html.light .app{background:var(--bg);color:var(--fg)}
html.light .lay button.on,.app.light .mini.on .mh em{color:#fff}
.app .pane,.grid.mtf{background:var(--chartbg)}
/* la marca EL ARTE GRÁFICO nunca se quita; solo se puede quitar el mercado */
.pop.wide{width:min(380px,calc(100vw - 16px));max-width:none;padding:8px}
.spq{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;margin-bottom:8px}
.spt{padding:0 0 8px!important}.spl{max-height:min(52vh,420px);overflow:auto}

.spr:hover{background:var(--card2)}.spr.on{background:var(--gbg)}.spr.on b{color:var(--gold2)}
.spr b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spr .p{font:600 12px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}.spr .c{font:11px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
/* ===== pulido de diseño ===== */
.top{height:46px;background:var(--bg2)}
.lay{background:var(--bg);border-color:var(--line)}.lay button{height:28px;padding:0 8px}.lay button:hover{background:var(--card2)}
.lay button.on{background:var(--gold);color:#16120a;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn{background:var(--card);border-color:var(--line2);height:32px;color:var(--fg2)}.btn:hover{border-color:var(--gold);color:var(--fg)}
.btn.ic{width:34px;padding:0;justify-content:center}.btn.ic .t:not(:empty){margin-right:2px}
@media (min-width:1181px){.btn.ic{width:auto;padding:0 10px}}

.wsym{padding:0 10px!important}.wsym b{font-weight:700;letter-spacing:-.01em}
.wtf{background:var(--gbg)!important;border-color:transparent!important;color:var(--gold2)!important}
.wp{color:var(--mut)!important}.wp:hover{color:var(--fg)!important}.wp.on{background:var(--card2)!important;color:var(--fg)!important}
.dbar{background:var(--bg2);width:46px}.dt{width:36px;height:34px;border-radius:8px}.dt:hover{background:var(--card2);color:var(--fg)}
.dt.act,.dt.tg.on{background:var(--gbg);color:var(--gold)}
.dg .more{color:var(--mut);opacity:.75}
.ft{color:var(--mut)}.ft b{color:var(--fg2)}.ft.on b{color:var(--fg)}
.ft.on{background:var(--bg2)}.ftw{background:var(--bg)}
.wl{background:var(--bg2)}.wl input,.spq,.wmbox .mq{background:var(--bg);border-color:var(--line2);height:34px}
.wl input:focus,.spq:focus,.wmbox .mq:focus,.wtxt input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gbg)}
.tabs button{background:transparent;border-color:var(--line2);color:var(--mut)}.tabs button:hover{color:var(--fg)}.tabs button.on{background:var(--gbg);border-color:transparent;color:var(--gold2)}
.sy{border-radius:8px}.sy:hover{background:var(--card2)}.sy.on{background:var(--gbg);border-color:transparent}
.sy small{color:var(--dim)}.fv{color:var(--dim)}

.tfr:hover,.wmenu>button:hover,.wmenu>button.hov,.ir:hover,.spr:hover,.sw:hover{background:var(--card2)}
.ph,.wmenu .mt,.wmbox .ml{color:var(--dim)!important;font-weight:600}
.mini{background:var(--bg2);border-color:var(--line)}.mini:hover{border-color:var(--line2)}.mini.on{background:var(--bg2);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.grid.mtf>.pane:first-child{border-color:var(--line2)}
.grid{background:var(--line)}
.st.live i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.wstyle{background:var(--card);box-shadow:var(--shadow)}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
html.light .lay button.on{color:#fff}html.light .wtf{color:var(--gold)!important}
